name: ✨ Feature request
about: Propose new functionality or an improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      description: What problem does this solve? Describe the user need or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the feature work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought of, and why you prefer the one above.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Urgent
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: dropdown
    id: moscow
    attributes:
      label: MoSCoW
      description: For planning purposes.
      options:
        - Must have
        - Should have
        - Could have
        - Won't have (this release)
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that prove the feature works.
    validations:
      required: true
  - type: textarea
    id: epic
    attributes:
      label: Related epic
      description: Issue number of the parent epic, if any.
